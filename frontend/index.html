<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="57x57" href="/apple-touch-icon-57.png" />
    <link rel="apple-touch-icon" sizes="72x72" href="/apple-touch-icon-72.png" />
    <link rel="apple-touch-icon" sizes="76x76" href="/apple-touch-icon-76.png" />
    <link rel="apple-touch-icon" sizes="114x114" href="/apple-touch-icon-114.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/apple-touch-icon-144.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#448AFF" />
    <meta name="description" content="Construction management and approval workflow system for hospital projects" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hospital ERP" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Hospital Construction ERP</title>
    <style>
      /* Boot splash — shown instantly while the JS bundle downloads/parses.
         On iOS Home Screen launches the standalone cache is cold and the
         bundle is large; without this the screen is pure white for seconds.
         React replaces this content when it mounts. */
      .boot-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background: #E3F2FD;
        font-family: -apple-system, Roboto, Helvetica, Arial, sans-serif;
      }
      .boot-splash img { width: 96px; height: 96px; margin-bottom: 18px; }
      .boot-spinner {
        width: 30px;
        height: 30px;
        border: 3px solid #448AFF;
        border-top-color: transparent;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash">
        <img src="/icon-192.png" alt="Hospital ERP" />
        <div class="boot-spinner"></div>
      </div>
    </div>
    <script>
      // Wake the API while the JS bundle downloads+parses. The backend sleeps
      // when idle (Railway) — pinging /health here overlaps the server wake-up
      // with the client boot instead of making dashboard queries wait for it.
      try { fetch('/health', { cache: 'no-store' }).catch(function () {}); } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
