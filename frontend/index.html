<!DOCTYPE html>

    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png?v=3" />

    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=3" />
    <link rel="apple-touch-icon" sizes="57x57" href="/apple-touch-icon-57.png?v=3" />
    <link rel="apple-touch-icon" sizes="72x72" href="/apple-touch-icon-72.png?v=3" />
    <link rel="apple-touch-icon" sizes="76x76" href="/apple-touch-icon-76.png?v=3" />
    <link rel="apple-touch-icon" sizes="114x114" href="/apple-touch-icon-114.png?v=3" />
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120.png?v=3" />
    <link rel="apple-touch-icon" sizes="144x144" href="/apple-touch-icon-144.png?v=3" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/manifest.webmanifest?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Construction management and approval workflow system for hospital projects" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hospital ERP" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Hospital Construction ERP</title>
    <style>
      /* Boot splash — shown instantly while the JS bundle downloads/parses.
         On iOS Home Screen launches the standalone cache is cold and the
         bundle is large; without this the screen is pure white for seconds.
         React replaces this content when it mounts. */
      .boot-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background: #000;
        font-family: -apple-system, Roboto, Helvetica, Arial, sans-serif;
      }
      .boot-splash img { width: 96px; height: 96px; margin-bottom: 18px; }
      .boot-spinner {
        width: 30px;
        height: 30px;
        border: 3px solid #4f9cf9;
        border-top-color: transparent;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      /* Opening video overlay — plays straight from HTML, independent of
         React, so it starts instantly and can never hang the app. */
      #opening-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 1;
        transition: opacity 0.25s ease;
        cursor: pointer;
      }
      #opening-splash video {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      /* Thought of the Day — dashboard palette + font, subtle fade-in. */
      #opening-splash .tq {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 0 34px;
        width: 100%;
        box-sizing: border-box;
        max-width: 620px;
        line-height: 1.4;
        animation: tq-in 0.5s ease-out both;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      #opening-splash .tq-mark {
        font-size: 56px;
        line-height: 1;
        height: 30px;
        color: #4f9cf9;
        font-family: Georgia, 'Times New Roman', serif;
      }
      #opening-splash .tq-label {
        margin: 14px 0 12px;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.3em;
        line-height: 1.4;
        color: #8b98ad;
      }
      #opening-splash .tq-text {
        display: block;
        font-size: 22px;
        font-weight: 600;
        font-style: italic;
        line-height: 1.6;
        color: #e8edf7;
      }
      @media (max-width: 599px) {
        #opening-splash .tq-text { font-size: 19px; }
      }
      #opening-splash .tq-line {
        width: 58px;
        height: 2px;
        margin-top: 22px;
        border-radius: 2px;
        background: linear-gradient(90deg, #4f9cf9, #8b7cf6);
      }
      #opening-splash .tq-hint {
        margin-top: 26px;
        font-size: 10px;
        letter-spacing: 0.12em;
        line-height: 1.4;
        color: rgba(139,152,173,.55);
      }
      @keyframes tq-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash">
        <img src="/icon-192.png" alt="Hospital ERP" />
        <div class="boot-spinner"></div>
      </div>
    </div>
    <script>
      (function () {
        var KEY = 'hspl-opening-shown';
        var loggedIn = false, shown = false;
        try {
          loggedIn = !!localStorage.getItem('firebaseToken');
          shown = sessionStorage.getItem(KEY) === '1';
        } catch (e) { /* storage blocked — treat as logged out */ }
        // Only logged-in fresh opens get the intro; logged-out boots go
        // straight to the login screen (the post-login overlay replays it).
        if (!loggedIn || shown) return;
        try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
        var mobile = matchMedia('(max-width: 599px)').matches ||
          (matchMedia('(pointer: coarse)').matches && matchMedia('(orientation: portrait)').matches);
        var splash = document.createElement('div');
        splash.id = 'opening-splash';
        var v = document.createElement('video');
        v.src = mobile ? '/opening-mobile.mp4' : '/opening-desktop.mp4';
        v.muted = true;
        v.defaultMuted = true;
        v.autoplay = true;
        v.playsInline = true;
        v.setAttribute('playsinline', '');
        v.setAttribute('webkit-playsinline', '');
        var finished = false, videoDone = false, appReady = false, quoteDone = false;
        var done = function () {
          if (finished) return;
          finished = true;
          splash.style.opacity = '0';
          setTimeout(function () { splash.remove(); }, 260);
        };
        var tryDone = function () { if (videoDone && quoteDone && appReady) done(); };
        // React's OpeningVideo calls this once the dashboard queries settle —
        // the splash holds until the data is actually there, not just the video.
        window.__openingAppReady = function () { appReady = true; tryDone(); };
        // Keep in sync with src/utils/dailyQuote.ts.
        var QUOTES = [
          "Today's small steps will become tomorrow's bigger steps.",
          'Great things are built one careful decision at a time.',
          'Progress is quiet work done consistently.',
          'The best time to start was yesterday. The next best time is now.',
          'Small details make big structures.',
          'Measure twice, build once.',
          'Every strong foundation begins with a clear plan.',
          'Discipline today builds confidence tomorrow.',
          'What you track, you improve.',
          'Clarity in numbers, confidence in decisions.',
          'A well-kept record is a well-run project.',
          'Slow is smooth, and smooth is fast.',
          'Done is better than perfect — but accurate is better than both.',
          'Good accounts tell the story of good work.',
          'Plan the work, then work the plan.',
          'Attention to detail today prevents corrections tomorrow.',
          'Every rupee accounted for is a project protected.',
          'Consistency compounds.',
          'The quiet routines are what hold big projects together.',
          'Order in the books, clarity on the site.',
          'Build carefully. Record faithfully.',
          "Today's ledger is tomorrow's history.",
          'Trust is built line by line, entry by entry.',
          'Strong projects run on clear numbers.',
        ];
        var showQuote = function () {
          var start = new Date(new Date().getFullYear(), 0, 0);
          var day = Math.floor((Date.now() - start.getTime()) / 86400000);
          splash.innerHTML = '';
          var tq = document.createElement('div');
          tq.className = 'tq';
          var mark = document.createElement('div'); mark.className = 'tq-mark'; mark.textContent = '“';
          var label = document.createElement('div'); label.className = 'tq-label'; label.textContent = 'THOUGHT OF THE DAY';
          var text = document.createElement('div'); text.className = 'tq-text'; text.textContent = QUOTES[day % QUOTES.length];
          var line = document.createElement('div'); line.className = 'tq-line';
          var hint = document.createElement('div'); hint.className = 'tq-hint'; hint.textContent = 'TAP TO CONTINUE';
          tq.appendChild(mark); tq.appendChild(label); tq.appendChild(text); tq.appendChild(line); tq.appendChild(hint);
          splash.appendChild(tq);
          setTimeout(function () { quoteDone = true; tryDone(); }, 2300);
        };
        var videoDoneFn = function () {
          if (videoDone) return;
          videoDone = true;
          window.__hsplVideoDone = true;
          window.dispatchEvent(new Event('hspl-video-done'));
          showQuote();
          // If React never signals readiness (slow mount), don't hold forever.
          setTimeout(done, 6000);
        };
        v.addEventListener('ended', videoDoneFn);
        v.addEventListener('error', done); // broken video → straight to the app
        v.addEventListener('loadedmetadata', function () {
          if (v.duration > 0) setTimeout(videoDoneFn, Math.min(v.duration * 1000 + 400, 9000));
        });
        setTimeout(done, 9000); // hard cap — never stuck
        splash.addEventListener('click', done);
        splash.appendChild(v);
        document.body.appendChild(splash);
        v.play().catch(done); // autoplay blocked → straight to the app
      })();
    </script>
    <script>
      // Wake the API while the JS bundle downloads+parses. The backend sleeps
      // when idle (Railway) — pinging /health here overlaps the server wake-up
      // with the client boot instead of making dashboard queries wait for it.
      // On the native shell a relative '/health' would hit the bundled origin,
      // so resolve the absolute backend URL the same way appConfig does.
      try {
        var isNativeShell = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
        var apiBase = '%VITE_API_URL%';
        if (!apiBase || apiBase.charAt(0) === '%' || apiBase.charAt(0) === '/') {
          apiBase = isNativeShell
            ? 'https://hospital-erpbackend-production.up.railway.app/api'
            : '';
        }
        var healthUrl = apiBase ? apiBase.replace(/\/api\/?$/, '') + '/health' : '/health';
        fetch(healthUrl, { cache: 'no-store' }).catch(function () {});
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
