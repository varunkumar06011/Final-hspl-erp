name: iOS Build (.ipa)

# Builds the Hospital ERP frontend, wraps it in the Capacitor iOS project
# (frontend/ios), signs it and produces an App Store-ready .ipa.
#
# ── Required repository secrets ──────────────────────────────────────────
#   IOS_DISTRIBUTION_CERT_P12   base64-encoded .p12 of your Apple
#                               "iOS Distribution" certificate
#   IOS_DISTRIBUTION_CERT_PASSWORD  password the .p12 was exported with
#   IOS_PROVISIONING_PROFILE    base64-encoded .mobileprovision (App Store,
#                               bundle id com.vgrand.hospitalerp)
#   APP_STORE_CONNECT_KEY_ID     App Store Connect API key ID
#   APP_STORE_CONNECT_ISSUER_ID  Issuer ID
#   APP_STORE_CONNECT_KEY        base64-encoded AuthKey_XXXXX.p8 private key
#                               (uploads every build to TestFlight)
#   GOOGLE_SERVICE_INFO_PLIST    base64-encoded GoogleService-Info.plist from
#                               the Firebase console iOS app — required for push.
#                               (Alternatively commit the file to
#                               frontend/ios/App/App/GoogleService-Info.plist)
#
# ── Build-time Vite env (vars or secrets — secrets win) ──────────────────
#   VITE_API_URL                 (default: production Railway API)
#   VITE_QR_BASE_URL             (default: Vercel deployment)
#   VITE_FIREBASE_API_KEY / AUTH_DOMAIN / PROJECT_ID / STORAGE_BUCKET /
#   MESSAGING_SENDER_ID / APP_ID / VAPID_KEY

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Marketing version (CFBundleShortVersionString)"
        required: false
        default: "1.0"
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - "shared/**"
      - ".github/workflows/ios-build.yml"

concurrency:
  group: ios-build
  cancel-in-progress: true

env:
  BUNDLE_ID: com.vgrand.hospitalerp
  SCHEME: App
  XCODE_PROJECT: frontend/ios/App/App.xcodeproj
  # ARCHIVE_PATH / EXPORT_DIR are set per-step — the `runner` context is not
  # available in workflow-level env.

jobs:
  build:
    name: Build signed iOS .ipa
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required secrets
        env:
          IOS_DISTRIBUTION_CERT_P12: ${{ secrets.IOS_DISTRIBUTION_CERT_P12 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          missing=0
          for v in IOS_DISTRIBUTION_CERT_P12 IOS_DISTRIBUTION_CERT_PASSWORD IOS_PROVISIONING_PROFILE APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::secret $v is not configured"
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "::error::Configure the signing secrets listed at the top of .github/workflows/ios-build.yml"
            exit 1
          fi

      - name: Select latest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || vars.VITE_API_URL }}
          VITE_QR_BASE_URL: ${{ secrets.VITE_QR_BASE_URL || vars.VITE_QR_BASE_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY || vars.VITE_FIREBASE_VAPID_KEY }}
        run: |
          # Absolute API URL is mandatory in the native shell — a relative
          # '/api' would resolve against the bundled origin and fail.
          if [ -z "$VITE_API_URL" ]; then
            VITE_API_URL="https://hospital-erpbackend-production.up.railway.app/api"
          fi
          if [ -z "$VITE_QR_BASE_URL" ]; then
            VITE_QR_BASE_URL="https://hospital-erp2.vercel.app"
          fi
          export VITE_API_URL VITE_QR_BASE_URL
          npm run build --workspace shared
          npm run build --workspace frontend

      - name: Sync Capacitor iOS project
        working-directory: frontend
        run: npx cap sync ios

      - name: Write GoogleService-Info.plist (FCM push)
        env:
          PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          PLIST="frontend/ios/App/App/GoogleService-Info.plist"
          if [ -n "$PLIST_B64" ]; then
            echo "$PLIST_B64" | base64 --decode -o "$PLIST"
            echo "Wrote $PLIST from secret"
          elif [ -f "$PLIST" ]; then
            echo "Using committed $PLIST"
          else
            echo "::error::GoogleService-Info.plist missing — add it to frontend/ios/App/App/ or set the GOOGLE_SERVICE_INFO_PLIST secret (push notifications require it)"
            exit 1
          fi

      - name: Set version and build number
        working-directory: frontend/ios/App
        run: |
          agvtool new-marketing-version -all "${{ github.event.inputs.app_version || '1.0' }}"
          agvtool new-version -all "${{ github.run_number }}"

      - name: Import signing certificate and provisioning profile
        env:
          CERT: ${{ secrets.IOS_DISTRIBUTION_CERT_P12 }}
          CERT_PW: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || github.run_id }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/dist-cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"

          echo "$CERT" | base64 --decode -o "$CERT_PATH"
          echo "$PROFILE" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$CERT_PW" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychain -d user | tr -d '"')

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"

          # Extract profile metadata for the build steps
          PROFILE_INFO=$(security cms -D -i "$PROFILE_PATH")
          PROFILE_NAME=$(echo "$PROFILE_INFO" | plutil -extract Name raw -o - -)
          PROFILE_UUID=$(echo "$PROFILE_INFO" | plutil -extract UUID raw -o - -)
          TEAM_ID=$(echo "$PROFILE_INFO" | plutil -extract TeamIdentifier.0 raw -o - -)
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "Profile: $PROFILE_NAME ($PROFILE_UUID), team: $TEAM_ID"

      - name: Set production APNs environment
        run: |
          # Committed entitlements say "development" for local device builds;
          # the App Store provisioning profile requires "production".
          /usr/libexec/PlistBuddy -c "Set :aps-environment production" \
            frontend/ios/App/App/App.entitlements
          cat frontend/ios/App/App/App.entitlements

      - name: Resolve Swift package dependencies
        run: xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$SCHEME"

      - name: Archive
        env:
          ARCHIVE_PATH: ${{ runner.temp }}/HospitalERP.xcarchive
        run: |
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID"

      - name: Export .ipa
        env:
          ARCHIVE_PATH: ${{ runner.temp }}/HospitalERP.xcarchive
          EXPORT_DIR: ${{ runner.temp }}/export
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ls -la "$EXPORT_DIR"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: hospital-erp-ios-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30

      - name: Upload to App Store Connect (TestFlight)
        env:
          EXPORT_DIR: ${{ runner.temp }}/export
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/private_keys
          echo "$ASC_KEY" | base64 --decode -o ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          IPA=$(ls "$EXPORT_DIR"/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER"
          echo "Uploaded $IPA to App Store Connect"

      - name: Summary
        if: success()
        run: |
          {
            echo "### iOS build succeeded"
            echo "- Bundle: \`$BUNDLE_ID\`"
            echo "- Version: \`${{ github.event.inputs.app_version || '1.0' }} (${{ github.run_number }})\`"
            echo "- Artifact: \`hospital-erp-ios-${{ github.run_number }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
