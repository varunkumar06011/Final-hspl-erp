name: Database Backup

on:
  schedule:
    # 20:47 UTC daily == 02:17 IST (India). GitHub cron is always UTC.
    - cron: "47 20 * * *"
  workflow_dispatch:
    inputs:
      retention_days:
        description: "Days to keep the backup artifact (1-90)"
        required: false
        default: "30"

# The backup is a full production dump stored as a workflow artifact, so this
# repository MUST stay private (artifacts of public repos are downloadable by anyone).
permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

env:
  PG_MAJOR: "17"

jobs:
  backup:
    name: Backup Supabase PostgreSQL to GitHub artifact
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout backup scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/backup
          sparse-checkout-cone-mode: false

      - name: Refuse to run in a public repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$(gh api "repos/${{ github.repository }}" --jq .private)" != "true" ]; then
            echo "::error::Repository is public; refusing to store a database dump as an artifact. Make the repo private."
            exit 1
          fi

      - name: Check required secrets are configured
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo "::error::secret SUPABASE_DB_URL is not configured"; exit 1; fi

      - name: Install PostgreSQL client ${{ env.PG_MAJOR }}
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends "postgresql-client-${PG_MAJOR}"
          # The runner image ships an older client; put the versioned binaries first on PATH.
          PG_BIN="/usr/lib/postgresql/${PG_MAJOR}/bin"
          test -x "${PG_BIN}/pg_dump"
          echo "${PG_BIN}" >> "$GITHUB_PATH"
          "${PG_BIN}/pg_dump" --version | grep -q " ${PG_MAJOR}\."

      - name: Create and validate backup
        id: backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_DIR: ${{ runner.temp }}/backup
        run: bash scripts/backup/backup-database.sh

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ steps.backup.outputs.backup_date }}-${{ github.run_number }}
          path: ${{ steps.backup.outputs.backup_dir }}
          retention-days: ${{ github.event.inputs.retention_days || '30' }}
          if-no-files-found: error

      - name: Summary
        if: success()
        run: |
          {
            echo "### Database backup succeeded"
            echo "- Backup date: \`${{ steps.backup.outputs.backup_date }}\`"
            echo "- Artifact: \`db-backup-${{ steps.backup.outputs.backup_date }}-${{ github.run_number }}\` (kept ${{ github.event.inputs.retention_days || '30' }} days)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup local backup files
        if: always()
        run: rm -rf "${{ runner.temp }}/backup"
